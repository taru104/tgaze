[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tgaze"
version = "0.1.0"
description = "Webcam eye tracking that outputs where you look on screen — CPU-only, calibration-light"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "taru104" }]
keywords = ["eye-tracking", "gaze-estimation", "gaze-tracking", "mediapipe", "webcam", "computer-vision"]
license = { text = "LicenseRef-Proprietary-Tgaze" }  # source-available; 利用には許諾が必要(LICENSE参照)
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "mediapipe>=0.10",
    "scikit-learn>=1.3",
    "scipy>=1.10",
]

[project.urls]
Homepage = "https://github.com/taru104/tgaze"
Repository = "https://github.com/taru104/tgaze"

# ── パッケージ構成についての注意 ────────────────────────────────────────────
# 現状 `tgaze` は、リポジトリ直下のコアモジュール
#   (features / rich16d / appearance / calibration / estimator / estimator_appearance / filters / config)
# と、実行時に必要な `face_landmarker.task` (3.6MB) に依存している。
# そのため **リポジトリを clone した状態でのみ動く**。
#   pip install -e .        ← これは動く（__file__ がリポジトリ内を指すため）
#   pip install tgaze       ← PyPI公開はまだできない
# PyPI に出すには上記モジュールを tgaze/ 配下へ移し(直下には後方互換のシムを残す)、
# モデルファイルを package-data として同梱する必要がある。main.py の import を壊さずに
# やる作業なので、着手はユーザ確認のうえで。詳細は docs/launch_plan.md。
[tool.setuptools]
packages = ["tgaze"]
py-modules = [
    "features", "rich16d", "appearance", "calibration",
    "estimator", "estimator_appearance", "filters", "config",
]
